# Audit & Exploratory Feasibility Configuration for MICRO-TRACE
paths:
  raw_data_dir: "/content/drive/MyDrive/Micro-Trace/micro-trace-data/raw"
  interim_dir: "/content/drive/MyDrive/Micro-Trace/micro-trace-data/interim"
  processed_dir: "/content/drive/MyDrive/Micro-Trace/micro-trace-data/processed"
  reports_dir: "/content/drive/MyDrive/Micro-Trace/micro_trace/reports/feasibility"
  figures_dir: "/content/drive/MyDrive/Micro-Trace/micro_trace/reports/feasibility/figures"
  logs_dir: "/content/drive/MyDrive/Micro-Trace/micro_trace/logs"
  schema_mapping_path: "/content/drive/MyDrive/Micro-Trace/micro_trace/configs/schema_mapping.yaml"

matching_windows_days:
  - 0
  - 3
  - 7
  - 14

candidate_horizons_days:
  - name: "short_7_21d"
    min_days: 7
    max_days: 21
  - name: "biweekly_14_35d"
    min_days: 14
    max_days: 35
  - name: "monthly_14_56d"
    min_days: 14
    max_days: 56
  - name: "protocol_30_90d"
    min_days: 30
    max_days: 90
  - name: "any_future_gt0d"
    min_days: 1
    max_days: 400

thresholds:
  missingness_warn: 0.20
  missingness_critical: 0.50
  prevalence_thresholds: [0.01, 0.05, 0.10, 0.20]
  fc_extreme_high: 250.0
  fc_detection_low: 15.0

split_preview:
  random_seed: 42
  train_frac: 0.70
  calib_frac: 0.15
  test_frac: 0.15

logging:
  level: "INFO"
