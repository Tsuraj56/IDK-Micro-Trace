# Schema mapping configuration for IBDMDB / HMP2
metadata_table: "metadata/hmp2_metadata_2018-08-20.csv"

identifiers:
  participant_id: "Participant ID"
  sample_id: "External ID"
  collection_event_id: "site_sub_coll"
  visit_id: "visit_num"
  week_num: "week_num"
  interval_days: "interval_days"
  data_type: "data_type"
  site_name: "site_name"
  project: "Project"

dates:
  receipt_date: "date_of_receipt"

outcomes:
  fc_primary: "fecalcal"
  fc_secondary: "fecalcal_ng_ml"
  fc_tube_id: "Tube B:Fecal Calprotectin"
  fc_units_assumed: "ug/g (annotated as fecalcal and fecalcal_ng_ml in HMP2 metadata; unit discrepancy flagged)"

clinical:
  disease_subtype: "diagnosis"
  ibd_subtypes: ["CD", "UC"]
  control_subtypes: ["nonIBD"]
  age_consent: "consent_age"
  age_diagnosis: "Age at diagnosis"
  sex: "sex"
  race: "race"
  hbi: "hbi"
  sccai: "sccai"
  ses_cd: "SES-CD Score"
  sibdq: "SIBDQ Score"
  bowel_freq: "Bowel frequency during the day"
  abdominal_pain: "Abdominal pain"
  wellbeing: "General wellbeing"

medications:
  antibiotics: "Antibiotics"
  antibiotics_since_last: "Has the subject used any antibiotics since the last visit?"
  immunosuppressants: "Immunosuppressants (e.g. oral corticosteroids)"
  remicade: "Remicade (Infliximab)"
  humira: "Humira (Adalimumab)"
  cimzia: "Cimzia (Certolizumab)"
  prednisone: "Prednisone"
  azathioprine: "Azathioprine"
  mercaptopurine: "Mercaptopurine"

dietary_variables:
  - "Soft drinks, tea or coffee with sugar (corn syrup, maple syrup, cane sugar, etc)"
  - "Diet soft drinks, tea or coffee with sugar (Stevia, Equal, Splenda etc)"
  - "Fruit juice (orange, apple, cranberry, prune etc.)"
  - "Water"
  - "Alcohol (beer, brandy, spirits, hard liquor, wine, aperitif, etc.)"
  - "Yogurt or other foods containing active bacterial cultures (kefir, sauerkraut)"
  - "Dairy (milk, cream, ice cream, cheese, cream cheese)"
  - "Probiotic"
  - "Fruits (no juice) (Apples, raisins, bananas, oranges, strawberries, blueberries"
  - "Vegetables (salad, tomatoes, onions, greens, carrots, peppers, green beans, etc)"
  - "Beans (tofu, soy, soy burgers, lentils, Mexican beans, lima beans etc)"
  - "Whole grains (wheat, oats, brown rice, rye, quinoa, wheat bread, wheat pasta)"
  - "Starch (white rice, bread, pizza, potatoes, yams, cereals, pancakes, etc.)"
  - "Eggs"
  - "Processed meat (other red or white meat such as lunch meat, ham, salami, bologna"
  - "Red meat (beef, hamburger, pork, lamb)"
  - "White meat (chicken, turkey, etc.)"
  - "Shellfish (shrimp, lobster, scallops, etc.)"
  - "Fish (fish nuggets, breaded fish, fish cakes, salmon, tuna, etc.)"
  - "Sweets (pies, jam, chocolate, cake, cookies, etc.)"
  - "Tea or coffee no sugar and no sugar replacement"

qc_variables:
  reads_raw: "reads_raw"
  reads_filtered: "reads_filtered"
  reads_qc_fail: "reads_qc_fail"
  reads_human: "reads_human"
  reads_ribosomal: "reads_ribosomal"
  reads_viral: "reads_viral"
  pdo_number: "PDO Number"
  lcset: "LCSET"

omics_tables:
  mgx_taxonomy_v2:
    path: "products/HMP2/MGX/2018-05-04/taxonomic_profiles.tsv.gz"
    modality: "taxonomy"
    assay: "MGX_WGS"
    tool: "MetaPhlAn2"
    representation: "relative_abundance"
    sample_id_suffix_strip: ""
  mgx_taxonomy_v3:
    path: "products/HMP2/MGX/2018-05-04/taxonomic_profiles_3.tsv.gz"
    modality: "taxonomy"
    assay: "MGX_WGS"
    tool: "MetaPhlAn3"
    representation: "relative_abundance_percent"
    sample_id_suffix_strip: "_profile"
  s16_biopsy_taxonomy:
    path: "products/HMP2/16S/2018-01-07/taxonomic_profiles.tsv.gz"
    modality: "taxonomy"
    assay: "16S_amplicon_biopsy"
    tool: "16S_OTU_pipeline"
    representation: "read_counts"
    sample_id_suffix_strip: ""
  s16_pilot_stool_taxonomy:
    path: "products/HMP2_Pilot/16S/taxonomic_profiles.tsv"
    modality: "taxonomy"
    assay: "16S_amplicon_stool_pilot"
    tool: "16S_OTU_pipeline"
    representation: "relative_abundance"
    sample_id_suffix_strip: ""
  mgx_pathways_v2:
    path: "products/HMP2/MGX/2018-05-04/pathabundance_relab.tsv.gz"
    modality: "function_potential"
    assay: "MGX_WGS"
    tool: "HUMAnN2_MetaCyc"
    representation: "relative_abundance"
    sample_id_suffix_strip: ""
  mgx_pathways_v3:
    path: "products/HMP2/MGX/2018-05-04/pathabundances_3.tsv.gz"
    modality: "function_potential"
    assay: "MGX_WGS"
    tool: "HUMAnN3_MetaCyc"
    representation: "cpm"
    sample_id_suffix_strip: "_pathabundance_cpm"
  mgx_ecs_v2:
    path: "products/HMP2/MGX/2018-05-04/ecs_relab.tsv.gz"
    modality: "function_potential"
    assay: "MGX_WGS"
    tool: "HUMAnN2_EC"
    representation: "relative_abundance"
    sample_id_suffix_strip: ""
  mgx_ecs_v3:
    path: "products/HMP2/MGX/2018-05-04/ecs_3.tsv.gz"
    modality: "function_potential"
    assay: "MGX_WGS"
    tool: "HUMAnN3_EC"
    representation: "cpm"
    sample_id_suffix_strip: "_level4ec"
  mtx_pathways_v2:
    path: "products/HMP2/MTX/2017-12-14/pathabundance_relab.tsv.gz"
    modality: "function_expression"
    assay: "MTX_RNAseq"
    tool: "HUMAnN2_MetaCyc"
    representation: "relative_abundance"
    sample_id_suffix_strip: ""
  mtx_ecs_v2:
    path: "products/HMP2/MTX/2017-12-14/ecs_relab.tsv.gz"
    modality: "function_expression"
    assay: "MTX_RNAseq"
    tool: "HUMAnN2_EC"
    representation: "relative_abundance"
    sample_id_suffix_strip: ""
