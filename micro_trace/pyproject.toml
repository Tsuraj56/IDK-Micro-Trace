[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "micro-trace"
version = "0.1.0"
description = "MICRO-TRACE: IBDMDB Dataset Audit & Feasibility Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
micro-trace-audit = "micro_trace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
